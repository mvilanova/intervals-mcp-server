# Personal dashboard stack. Run from /srv/dashboard on the VPS with:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# The `migrate` service runs once on every `up`, applies migrations, then exits.
# `web` only starts after migrate completes successfully.

name: dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../web
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ../web
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DASHBOARD_PIN: ${DASHBOARD_PIN}
      INTERVALS_API_KEY: ${INTERVALS_API_KEY}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
